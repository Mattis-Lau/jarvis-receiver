<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JARVIS Receiver</title>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(rgba(70, 183, 231, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(70, 183, 231, .025) 1px, transparent 1px),
        radial-gradient(circle at 50% 38%, rgba(36, 150, 205, .15), transparent 38%),
        linear-gradient(180deg, #06111b 0%, #02070c 100%);
      background-size: 4.5vw 4.5vw, 4.5vw 4.5vw, auto, auto;
      color: #eaf8ff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 3.2vh 3.6vw 2.6vh;
    }

    .top {
      height: 10vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(111,211,255,.28);
    }

    .brand {
      font-size: 2.2vw;
      letter-spacing: .65vw;
      font-weight: 700;
      white-space: nowrap;
    }

    .online {
      font-size: 1.05vw;
      letter-spacing: .16vw;
      color: #86dcff;
      white-space: nowrap;
    }

    .dot {
      display: inline-block;
      width: .6vw;
      height: .6vw;
      border-radius: 50%;
      background: #86dcff;
      margin-right: .65vw;
      box-shadow: 0 0 16px #86dcff;
    }

    main {
      height: 82vh;
      padding-top: 3.5vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      max-width: none;
      margin: 0;
    }

    .eyebrow {
      color: #78d4ff;
      font-size: 1vw;
      letter-spacing: .25vw;
      text-transform: uppercase;
      margin-bottom: 1.2vh;
      flex: 0 0 auto;
    }

    h1 {
      font-size: 3.3vw;
      line-height: 1.08;
      margin: 0 0 1.1vh;
      font-weight: 500;
      flex: 0 0 auto;
    }

    .subtitle {
      font-size: 1.55vw;
      line-height: 1.25;
      color: #aac4d1;
      margin-bottom: 2.5vh;
      flex: 0 0 auto;
    }

    .hint {
      margin-top: 1.7vh;
      font-size: 1.05vw;
      color: #78d4ff;
      flex: 0 0 auto;
    }

    .grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2.2vh 1.55vw;
      margin-top: .4vh;
    }

    .card {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(85, 209, 255, .42);
      background:
        linear-gradient(135deg, rgba(15, 46, 67, .88), rgba(5, 18, 30, .76));
      border-radius: 1.05vw;
      padding: 1.7vh 1.55vw 1.45vh;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.025),
        0 0 2.1vw rgba(26, 167, 224, .07);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: .22vw;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(93, 222, 255, .95),
        rgba(66, 132, 255, .28)
      );
      box-shadow: 0 0 1vw rgba(73, 211, 255, .48);
    }

    .card::after {
      content: "";
      position: absolute;
      right: -4vw;
      top: -7vh;
      width: 13vw;
      height: 13vw;
      border: 1px solid rgba(94, 216, 255, .10);
      border-radius: 50%;
      box-shadow:
        0 0 0 1.4vw rgba(75, 176, 227, .025),
        0 0 0 3vw rgba(75, 176, 227, .018);
      pointer-events: none;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .7vh;
      position: relative;
      z-index: 1;
    }

    .num {
      color: #82e3ff;
      font-size: .88vw;
      letter-spacing: .22vw;
      font-weight: 700;
    }

    .card-meta {
      display: flex;
      gap: .45vw;
      align-items: center;
    }

    .chip {
      border: 1px solid rgba(102, 212, 255, .28);
      background: rgba(70, 182, 232, .08);
      color: #9edfff;
      border-radius: 999px;
      padding: .36vh .55vw;
      font-size: .68vw;
      letter-spacing: .045vw;
      white-space: nowrap;
    }

    .card-title {
      position: relative;
      z-index: 1;
      font-size: 1.72vw;
      line-height: 1.04;
      font-weight: 600;
      margin: .15vh 0 .7vh;
      color: #f4fbff;
      max-width: 86%;
    }

    .desc {
      position: relative;
      z-index: 1;
      font-size: .95vw;
      line-height: 1.28;
      color: #a9c7d6;
      max-width: 94%;
      min-height: 2.4em;
      overflow: hidden;
    }

    .ingredients {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding-top: .75vh;
      display: flex;
      gap: .42vw;
      flex-wrap: wrap;
      border-top: 1px solid rgba(107, 207, 247, .11);
    }

    .ingredient {
      color: #d7f4ff;
      background: rgba(113, 211, 255, .055);
      border-radius: .36vw;
      padding: .34vh .45vw;
      font-size: .72vw;
      white-space: nowrap;
    }

    .text {
      font-size: 1.4vw;
      line-height: 1.45;
      color: #c8dce6;
      white-space: pre-wrap;
      overflow: hidden;
    }

    .step {
      border-left: 3px solid #75d8ff;
      padding-left: 1.6vw;
      margin-top: 1vh;
    }

    #jarvisAudio {
      display: none;
    }

    #debug {
      position: fixed;
      right: 1.2vw;
      bottom: .8vh;
      font-size: .7vw;
      color: rgba(135,220,255,.42);
      pointer-events: none;
    }

    /* Rezeptansicht */
    .recipe-layout {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: .85fr 1.35fr;
      gap: 2vw;
    }

    .recipe-panel {
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(111,211,255,.30);
      background: rgba(11,35,50,.52);
      border-radius: 1.1vw;
      padding: 2.2vh 1.8vw;
    }

    .recipe-panel h2 {
      margin: 0 0 1.4vh;
      color: #78d4ff;
      font-size: 1.5vw;
      font-weight: 500;
    }

    .recipe-panel ul,
    .recipe-panel ol {
      margin: 0;
      padding-left: 1.5vw;
      font-size: 1.18vw;
      line-height: 1.42;
    }

    .recipe-panel li {
      margin-bottom: .7vh;
    }
  
    /* ===== JARVIS CINEMATIC HUD ===== */
    .jarvis-hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      display: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 48%, rgba(24,170,255,.10), transparent 26%),
        radial-gradient(circle at 50% 48%, rgba(0,210,255,.04), transparent 48%);
    }
    .jarvis-hud.visible { display: block; }

    .hud-grid {
      position: absolute;
      inset: 0;
      opacity: .12;
      background-image:
        linear-gradient(rgba(80,200,255,.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80,200,255,.22) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle, black 10%, transparent 76%);
    }

    .hud-scanline {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      top: -5%;
      background: linear-gradient(90deg, transparent, rgba(95,220,255,.8), transparent);
      box-shadow: 0 0 18px rgba(64,190,255,.55);
      opacity: .32;
      animation: hudScan 5s linear infinite;
    }

    .hud-center {
      position: absolute;
      left: 50%;
      top: 45%;
      width: 440px;
      height: 440px;
      transform: translate(-50%, -50%);
    }

    .hud-core, .hud-ring, .hud-ring2, .hud-ring3 {
      position: absolute;
      border-radius: 50%;
      inset: 50%;
      transform: translate(-50%, -50%);
    }

    .hud-core {
      width: 112px;
      height: 112px;
      background: radial-gradient(circle,
        rgba(230,252,255,.98) 0%,
        rgba(74,206,255,.90) 18%,
        rgba(21,139,219,.54) 42%,
        rgba(0,55,105,.16) 64%,
        transparent 72%);
      box-shadow:
        0 0 24px rgba(120,225,255,.85),
        0 0 70px rgba(42,169,255,.55),
        0 0 150px rgba(0,131,255,.25);
      animation: coreIdle 2.4s ease-in-out infinite;
    }

    .hud-ring {
      width: 220px; height: 220px;
      border: 2px solid rgba(76,205,255,.62);
      border-left-color: transparent;
      border-right-color: rgba(76,205,255,.18);
      box-shadow: inset 0 0 25px rgba(0,160,255,.12);
      animation: spin 5.5s linear infinite;
    }
    .hud-ring2 {
      width: 306px; height: 306px;
      border: 1px dashed rgba(91,214,255,.38);
      border-top-color: rgba(200,249,255,.88);
      animation: spinReverse 9s linear infinite;
    }
    .hud-ring3 {
      width: 390px; height: 390px;
      border: 1px solid rgba(69,184,255,.18);
      border-top: 3px solid rgba(110,221,255,.72);
      border-bottom: 3px solid rgba(110,221,255,.34);
      animation: spin 15s linear infinite;
    }

    .hud-ticks {
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(125,224,255,.65) 0deg 1deg,
        transparent 1deg 8deg
      );
      mask: radial-gradient(circle, transparent 67%, black 68% 70%, transparent 71%);
      opacity: .40;
      animation: spin 28s linear infinite;
    }

    .hud-status-wrap {
      position: absolute;
      left: 50%;
      top: calc(45% + 260px);
      transform: translateX(-50%);
      width: min(78vw, 1200px);
      text-align: center;
      text-shadow: 0 0 18px rgba(60,200,255,.35);
    }

    .hud-status {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(188,239,255,.96);
    }
    .hud-detail {
      margin-top: 18px;
      font-size: 32px;
      line-height: 1.35;
      color: rgba(230,247,252,.88);
      max-height: 2.8em;
      overflow: hidden;
    }
    .hud-meta {
      position: absolute;
      top: 44px;
      left: 56px;
      color: rgba(122,214,255,.56);
      letter-spacing: .22em;
      font-size: 15px;
      text-transform: uppercase;
    }
    .hud-meta.right {
      left: auto;
      right: 56px;
      text-align: right;
    }

    .jarvis-hud[data-state="listening"] .hud-core {
      animation: coreListen .72s ease-in-out infinite alternate;
    }
    .jarvis-hud[data-state="listening"] .hud-ring {
      animation-duration: 2.2s;
    }
    .jarvis-hud[data-state="thinking"] .hud-ring {
      animation-duration: .95s;
    }
    .jarvis-hud[data-state="thinking"] .hud-ring2 {
      animation-duration: 1.8s;
    }
    .jarvis-hud[data-state="transcribing"] .hud-ring3 {
      animation-duration: 4s;
    }
    .jarvis-hud[data-state="speaking"] .hud-core {
      animation: coreSpeak .36s ease-in-out infinite alternate;
    }
    .jarvis-hud[data-state="understood"] .hud-core {
      box-shadow:
        0 0 30px rgba(160,240,255,.95),
        0 0 90px rgba(50,200,255,.70);
    }

    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes spinReverse { to { transform: translate(-50%, -50%) rotate(-360deg); } }
    @keyframes hudScan { from { top: -5%; } to { top: 105%; } }
    @keyframes coreIdle {
      0%,100% { transform: translate(-50%, -50%) scale(.94); opacity: .80; }
      50% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; }
    }
    @keyframes coreListen {
      from { transform: translate(-50%, -50%) scale(.88); filter: brightness(.85); }
      to { transform: translate(-50%, -50%) scale(1.15); filter: brightness(1.22); }
    }
    @keyframes coreSpeak {
      from { transform: translate(-50%, -50%) scale(.90); }
      to { transform: translate(-50%, -50%) scale(1.12); }
    }

  </style>
</head>

<body>
  <audio id="jarvisAudio" preload="auto"></audio>
  <header class="top">
    <div class="brand">JARVIS</div>
    <div class="online"><span class="dot"></span>SYSTEM ONLINE</div>
  </header>

  <main id="main">
    <div class="eyebrow">ASSISTENT</div>
    <h1>Bereit.</h1>
    <div class="subtitle">Warte auf eine Anfrage.</div>
    <div class="hint">ONLINE</div>
  </main>

  <div id="debug">Receiver gestartet</div>

  <script>
    const NAMESPACE = 'urn:x-cast:com.jarvis.receiver';
    const context = cast.framework.CastReceiverContext.getInstance();
    const main = document.getElementById('main');
    const debug = document.getElementById('debug');

    function esc(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setDebug(text) {
      debug.textContent = text;
      console.log('[JARVIS]', text);
    }

    function showStandby(data = {}) {
      main.innerHTML = `
        <div class="eyebrow">${esc(data.eyebrow || 'ASSISTENT')}</div>
        <h1>${esc(data.title || 'Bereit.')}</h1>
        <div class="subtitle">${esc(data.subtitle || 'Warte auf eine Anfrage.')}</div>
        <div class="hint">${esc(data.hint || 'ONLINE')}</div>
      `;
    }

    function showIdeas(data) {
      const items = Array.isArray(data.items) ? data.items.slice(0, 4) : [];

      main.innerHTML = `
        <div class="eyebrow">CULINARY // OPTIONS</div>
        <h1>${esc(data.title || 'Was möchtest du kochen?')}</h1>
        <div class="subtitle">${esc(data.subtitle || '')}</div>

        <div class="grid">
          ${items.map((item, i) => {
            const ingredients = Array.isArray(item.ingredients)
              ? item.ingredients.slice(0, 3)
              : [];

            return `
              <div class="card">
                <div class="card-head">
                  <div class="num">OPTION 0${i + 1}</div>
                  <div class="card-meta">
                    ${item.duration ? `<span class="chip">${esc(item.duration)}</span>` : ''}
                    ${item.difficulty ? `<span class="chip">${esc(item.difficulty)}</span>` : ''}
                  </div>
                </div>

                <div class="card-title">${esc(item.title || item.titel || '')}</div>
                <div class="desc">${esc(item.description || item.beschreibung || '')}</div>

                ${ingredients.length ? `
                  <div class="ingredients">
                    ${ingredients.map(x => `<span class="ingredient">${esc(x)}</span>`).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>

        <div class="hint">${esc(data.hint || 'Sag einfach die Nummer.')}</div>
      `;
    }

    function showRecipe(data) {
      const ingredients = Array.isArray(data.ingredients)
        ? data.ingredients
        : (Array.isArray(data.zutaten) ? data.zutaten : []);

      const steps = Array.isArray(data.steps)
        ? data.steps
        : (Array.isArray(data.schritte) ? data.schritte : []);

      if (ingredients.length || steps.length) {
        main.innerHTML = `
          <div class="eyebrow">REZEPT</div>
          <h1>${esc(data.title || data.titel || 'Rezept')}</h1>
          <div class="subtitle">${esc(data.subtitle || '')}</div>

          <div class="recipe-layout">
            <section class="recipe-panel">
              <h2>Zutaten</h2>
              <ul>
                ${ingredients.map(x => `<li>${esc(x)}</li>`).join('')}
              </ul>
            </section>

            <section class="recipe-panel">
              <h2>Zubereitung</h2>
              <ol>
                ${steps.map(x => `<li>${esc(x)}</li>`).join('')}
              </ol>
            </section>
          </div>

          <div class="hint">${esc(data.hint || 'Sag „nächster Schritt“ zum Fortfahren.')}</div>
        `;
      } else {
        main.innerHTML = `
          <div class="eyebrow">REZEPT</div>
          <h1>${esc(data.title || 'Rezept')}</h1>
          <div class="subtitle">${esc(data.subtitle || '')}</div>
          <div class="text">${esc(data.text || data.content || '')}</div>
          <div class="hint">${esc(data.hint || 'Sag „nächster Schritt“ zum Fortfahren.')}</div>
        `;
      }
    }

    function showStep(data) {
      main.innerHTML = `
        <div class="eyebrow">SCHRITT ${esc(data.step || '')}</div>
        <h1>${esc(data.title || 'Zubereitung')}</h1>
        <div class="step">
          <div class="text">${esc(data.text || data.content || '')}</div>
        </div>
        <div class="hint">${esc(data.hint || 'Sag „weiter“, wenn du bereit bist.')}</div>
      `;
    }

    function showInfo(data) {
      main.innerHTML = `
        <div class="eyebrow">${esc(data.eyebrow || 'INFORMATION')}</div>
        <h1>${esc(data.title || 'JARVIS')}</h1>
        <div class="text">${esc(data.text || data.content || '')}</div>
        <div class="hint">${esc(data.hint || '')}</div>
      `;
    }

    const jarvisAudio = document.getElementById('jarvisAudio');

    let speechSenderId = null;
    let speechChunks = [];
    let speechExpectedChunks = 0;
    let speechMime = 'audio/mpeg';
    let speechObjectUrl = null;

    function sendSpeechEvent(type, extra = {}) {
      if (!speechSenderId) return;

      try {
        context.sendCustomMessage(
          NAMESPACE,
          speechSenderId,
          Object.assign(
            { type },
            extra
          )
        );
      } catch (err) {
        console.warn(
          'JARVIS Speech Event konnte nicht gesendet werden:',
          err
        );
      }
    }

    function speechBegin(senderId, data) {
      speechSenderId = senderId;
      speechExpectedChunks = Number(data.chunks || 0);
      speechMime = data.mime || 'audio/mpeg';
      speechChunks = new Array(speechExpectedChunks);

      setDebug(
        'TTS empfangen: 0/' + speechExpectedChunks
      );
    }

    function speechChunk(data) {
      const index = Number(data.index);

      if (
        Number.isInteger(index) &&
        index >= 0 &&
        index < speechChunks.length
      ) {
        speechChunks[index] = data.data || '';
      }
    }

    async function speechEnd() {
      try {
        if (
          !speechExpectedChunks ||
          speechChunks.some(chunk => typeof chunk !== 'string')
        ) {
          throw new Error(
            'TTS-Chunks unvollstaendig.'
          );
        }

        const base64 = speechChunks.join('');
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        if (speechObjectUrl) {
          URL.revokeObjectURL(speechObjectUrl);
        }

        const blob = new Blob(
          [bytes],
          { type: speechMime }
        );

        speechObjectUrl = URL.createObjectURL(blob);

        jarvisAudio.src = speechObjectUrl;
        jarvisAudio.currentTime = 0;

        setDebug('TTS wird abgespielt');

        await jarvisAudio.play();

      } catch (err) {
        console.error(
          'JARVIS Audio Error:',
          err
        );

        sendSpeechEvent(
          'SPEAK_ERROR',
          { error: String(err) }
        );

        speechSenderId = null;
        speechChunks = [];
        speechExpectedChunks = 0;
      }
    }

    jarvisAudio.addEventListener(
      'playing',
      () => {
        setDebug('TTS spielt');
        sendSpeechEvent('SPEAK_STARTED');
      }
    );

    jarvisAudio.addEventListener(
      'ended',
      () => {
        setDebug('TTS beendet');
        sendSpeechEvent('SPEAK_DONE');
        setHudState('active', 'Bereit', 'Du kannst direkt weitersprechen.');

        speechSenderId = null;
        speechChunks = [];
        speechExpectedChunks = 0;
      }
    );

    jarvisAudio.addEventListener(
      'error',
      () => {
        const code =
          jarvisAudio.error?.code ??
          'unbekannt';

        sendSpeechEvent(
          'SPEAK_ERROR',
          {
            error:
              'HTMLAudioElement Fehlercode ' +
              String(code)
          }
        );

        speechSenderId = null;
        speechChunks = [];
        speechExpectedChunks = 0;
      }
    );


    function setHudState(state, status, detail) {
      const hud = document.getElementById('jarvisHud');
      const statusEl = document.getElementById('hudStatus');
      const detailEl = document.getElementById('hudDetail');
      if (!hud || !statusEl || !detailEl) return;

      hud.classList.add('visible');
      hud.dataset.state = state || 'active';
      statusEl.textContent = status || 'JARVIS';
      detailEl.textContent = detail || '';
    }

    function hideHud() {
      const hud = document.getElementById('jarvisHud');
      if (hud) hud.classList.remove('visible');
    }

    setInterval(() => {
      const el = document.getElementById('hudClock');
      if (!el) return;
      const now = new Date();
      el.textContent =
        now.toLocaleTimeString('de-DE', { hour12: false }) +
        ' // SYSTEM ONLINE';
    }, 1000);

    function handleMessage(event) {
      let data = event.data;

      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (_) {
          data = { type: 'SHOW_INFO', text: data };
        }
      }

      if (!data || typeof data !== 'object') return;

      setDebug('Empfangen: ' + (data.type || 'unbekannt'));

      switch (data.type) {
        case 'SHOW_IDEAS':
          showIdeas(data);
          break;

        case 'SHOW_RECIPE':
          showRecipe(data);
          break;

        case 'SHOW_STEP':
          showStep(data);
          break;

        case 'SHOW_STATE':
          setHudState(
            data.state || 'active',
            data.status || data.title || 'JARVIS',
            data.detail || ''
          );
          break;

        case 'SHOW_INFO':
          hideHud();
          showInfo(data);
          break;

        case 'STANDBY':
        case 'SHOW_STANDBY':
          showStandby(data);
          break;

        case 'SPEAK_BEGIN':
          setHudState(
            'speaking',
            'Spreche',
            document.getElementById('hudDetail')?.textContent || ''
          );
          speechBegin(
            event.senderId,
            data
          );
          break;

        case 'SPEAK_CHUNK':
          speechChunk(data);
          break;

        case 'SPEAK_END':
          speechEnd();
          break;

        default:
          showInfo({
            title: 'Nachricht empfangen',
            text: JSON.stringify(data, null, 2)
          });
      }

      if (data.type !== 'SPEAK_CHUNK') {
        try {
          context.sendCustomMessage(
            NAMESPACE,
            event.senderId,
            { type: 'ACK', receivedType: data.type || null }
          );
        } catch (err) {
          console.warn('ACK konnte nicht gesendet werden:', err);
        }
      }
    }

    context.addCustomMessageListener(NAMESPACE, handleMessage);

    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    options.statusText = 'JARVIS bereit';
    options.customNamespaces = {};
    options.customNamespaces[NAMESPACE] =
      cast.framework.system.MessageType.JSON;

    context.start(options);
    setDebug('JARVIS Receiver bereit');
  </script>

  <div id="jarvisHud" class="jarvis-hud" data-state="standby">
    <div class="hud-grid"></div>
    <div class="hud-scanline"></div>
    <div class="hud-meta">JARVIS // NEURAL INTERFACE</div>
    <div class="hud-meta right" id="hudClock">SYSTEM ONLINE</div>
    <div class="hud-center">
      <div class="hud-ring3"></div>
      <div class="hud-ring2"></div>
      <div class="hud-ring"></div>
      <div class="hud-ticks"></div>
      <div class="hud-core"></div>
    </div>
    <div class="hud-status-wrap">
      <div id="hudStatus" class="hud-status">Bereit</div>
      <div id="hudDetail" class="hud-detail">Warte auf eine Anfrage.</div>
    </div>
  </div>

</body>
</html>
