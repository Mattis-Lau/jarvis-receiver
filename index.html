<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JARVIS</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #02050a; }
    body { font-family: Arial, Helvetica, sans-serif; }

    #scene {
      position: fixed; inset: 0; overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(12,48,74,.28) 0%, rgba(4,14,25,.16) 34%, rgba(1,4,8,0) 65%),
        radial-gradient(circle at 18% 24%, rgba(0,124,178,.10), transparent 30%),
        radial-gradient(circle at 82% 74%, rgba(0,83,140,.08), transparent 32%),
        linear-gradient(180deg, #050a11 0%, #02060b 50%, #010307 100%);
    }

    #scene::before {
      content: ""; position: absolute; inset: -25%; pointer-events: none;
      background:
        radial-gradient(ellipse at 35% 42%, rgba(80,180,230,.055), transparent 34%),
        radial-gradient(ellipse at 68% 58%, rgba(20,120,190,.04), transparent 36%);
      filter: blur(36px);
      animation: haze 18s ease-in-out infinite alternate;
    }

    #scene::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0,0,0,.58), transparent 18%, transparent 82%, rgba(0,0,0,.58)),
        linear-gradient(180deg, rgba(0,0,0,.38), transparent 19%, transparent 80%, rgba(0,0,0,.52));
      box-shadow: inset 0 0 180px rgba(0,0,0,.92);
    }

    @keyframes haze { from { transform: translate3d(-1.5%, -1%, 0) scale(1); } to { transform: translate3d(1.5%, 1%, 0) scale(1.06); } }

    #stars, #cloud, #glow { position: absolute; inset: 0; width: 100%; height: 100%; }
    #stars { opacity: .52; }
    #glow { filter: blur(18px); opacity: .55; }
    #cloud { filter: drop-shadow(0 0 7px rgba(68,190,255,.42)); }

    .ambient-line {
      position: absolute; left: 50%; top: 50%; width: 46vw; height: 1px;
      transform: translate(-50%,-50%);
      background: linear-gradient(90deg, transparent, rgba(61,180,239,.06), rgba(112,214,255,.13), rgba(61,180,239,.06), transparent);
      opacity: .45;
    }

    #debug { display: none; }
    #jarvisAudio { display: none; }
  </style>
</head>
<body>
  <div id="scene">
    <canvas id="stars"></canvas>
    <canvas id="glow"></canvas>
    <div class="ambient-line"></div>
    <canvas id="cloud"></canvas>
  </div>
  <div id="debug"></div>
  <audio id="jarvisAudio" preload="auto"></audio>

  <script>
    const NAMESPACE = 'urn:x-cast:com.jarvis.receiver';
    const context = cast.framework.CastReceiverContext.getInstance();
    const cloudCanvas = document.getElementById('cloud');
    const glowCanvas = document.getElementById('glow');
    const starsCanvas = document.getElementById('stars');
    const cloudCtx = cloudCanvas.getContext('2d');
    const glowCtx = glowCanvas.getContext('2d');
    const starsCtx = starsCanvas.getContext('2d');
    const jarvisAudio = document.getElementById('jarvisAudio');

    let W = 1920, H = 1080, DPR = 1;
    let state = 'standby';
    let stateChanged = performance.now();
    let particles = [];
    let stars = [];
    let audioLevel = 0;
    let smoothedAudio = 0;
    let audioContext = null;
    let analyser = null;
    let mediaSource = null;
    let analyserData = null;

    const STATE = {
      standby:      { speed:.00010, pulse:.020, spread:1.00, energy:.72, wobble:.16 },
      active:       { speed:.00018, pulse:.050, spread:1.02, energy:.94, wobble:.26 },
      listening:    { speed:.00023, pulse:.080, spread:1.04, energy:1.08, wobble:.34 },
      transcribing: { speed:.00034, pulse:.065, spread:.99, energy:1.03, wobble:.48 },
      understood:   { speed:.00028, pulse:.070, spread:1.00, energy:1.06, wobble:.38 },
      thinking:     { speed:.00053, pulse:.105, spread:.94, energy:1.20, wobble:.72 },
      speaking:     { speed:.00027, pulse:.135, spread:1.02, energy:1.30, wobble:.42 },
      followup:     { speed:.00015, pulse:.035, spread:1.01, energy:.88, wobble:.20 }
    };

    function setState(next) {
      state = STATE[next] ? next : 'active';
      stateChanged = performance.now();
    }

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 1.5);
      W = window.innerWidth; H = window.innerHeight;
      for (const c of [cloudCanvas, glowCanvas, starsCanvas]) {
        c.width = Math.floor(W * DPR); c.height = Math.floor(H * DPR);
        c.style.width = W + 'px'; c.style.height = H + 'px';
      }
      cloudCtx.setTransform(DPR,0,0,DPR,0,0);
      glowCtx.setTransform(DPR,0,0,DPR,0,0);
      starsCtx.setTransform(DPR,0,0,DPR,0,0);
      makeStars();
    }

    function makeStars() {
      const count = Math.max(70, Math.floor(W * H / 18000));
      stars = Array.from({length:count}, () => ({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*1.25+.15, a: Math.random()*.28+.04,
        tw: Math.random()*Math.PI*2
      }));
      starsCtx.clearRect(0,0,W,H);
      for (const s of stars) {
        starsCtx.beginPath();
        starsCtx.fillStyle = `rgba(92,180,226,${s.a})`;
        starsCtx.arc(s.x,s.y,s.r,0,Math.PI*2); starsCtx.fill();
      }
    }

    // Eine unregelmaessige, organische 3D-Punktwolke — absichtlich keine perfekte Kugel.
    function createPointCloud() {
      const count = 1850;
      particles = [];
      const golden = Math.PI * (3 - Math.sqrt(5));
      for (let i=0; i<count; i++) {
        const y = 1 - (i/(count-1))*2;
        const radius = Math.sqrt(Math.max(0,1-y*y));
        const theta = golden*i + (Math.random()-.5)*.12;
        let x = Math.cos(theta)*radius;
        let z = Math.sin(theta)*radius;

        // organische Verformung, damit es eher wie ein holografischer Kern wirkt
        const n1 = 1 + .10*Math.sin(theta*3 + y*5) + .045*Math.sin(theta*8-y*3);
        x *= n1 * (1.03 + .05*Math.sin(y*7));
        z *= n1 * (.88 + .05*Math.cos(y*6));
        const yy = y * (1.07 + .05*Math.sin(theta*4));

        particles.push({
          x, y:yy, z,
          seed: Math.random()*Math.PI*2,
          size: .58 + Math.random()*1.45,
          alpha: .34 + Math.random()*.66,
          drift: .002 + Math.random()*.009
        });
      }
    }

    function ensureAnalyser() {
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (!mediaSource) {
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = .82;
          analyserData = new Uint8Array(analyser.frequencyBinCount);
          mediaSource = audioContext.createMediaElementSource(jarvisAudio);
          mediaSource.connect(analyser);
          analyser.connect(audioContext.destination);
        }
        if (audioContext.state === 'suspended') audioContext.resume();
      } catch (e) { console.warn('Audio analyser:', e); }
    }

    function readAudio() {
      if (!analyser || !analyserData || jarvisAudio.paused) { audioLevel *= .88; return; }
      analyser.getByteFrequencyData(analyserData);
      let sum=0, n=Math.min(58, analyserData.length);
      for(let i=2;i<n;i++) sum += analyserData[i];
      audioLevel = Math.min(1, (sum/Math.max(1,n-2))/128);
    }

    function rotatePoint(p, ay, ax) {
      let x=p.x, y=p.y, z=p.z;
      let c=Math.cos(ay), s=Math.sin(ay);
      let x1=x*c-z*s, z1=x*s+z*c;
      c=Math.cos(ax); s=Math.sin(ax);
      let y1=y*c-z1*s, z2=y*s+z1*c;
      return [x1,y1,z2];
    }

    function draw(t) {
      readAudio();
      smoothedAudio += (audioLevel-smoothedAudio)*.16;
      const cfg = STATE[state] || STATE.active;
      const elapsed = t - stateChanged;
      const settle = Math.min(1, elapsed/600);
      const speakingBoost = state==='speaking' ? smoothedAudio : 0;
      const pulse = 1 + cfg.pulse*Math.sin(t*.0021) + speakingBoost*.18;
      const spread = cfg.spread*pulse;
      const centerX=W*.50, centerY=H*.50;
      const baseR=Math.min(W,H)*.255;
      const yaw=t*cfg.speed;
      const pitch=.20*Math.sin(t*.00013) + .055*Math.sin(t*.00051);

      cloudCtx.clearRect(0,0,W,H);
      glowCtx.clearRect(0,0,W,H);

      // ruhiger Kern-Glow
      const gr = glowCtx.createRadialGradient(centerX,centerY,0,centerX,centerY,baseR*1.38);
      const glowA = .075*cfg.energy + speakingBoost*.05;
      gr.addColorStop(0,`rgba(48,183,255,${glowA})`);
      gr.addColorStop(.38,`rgba(13,104,170,${glowA*.55})`);
      gr.addColorStop(1,'rgba(0,15,30,0)');
      glowCtx.fillStyle=gr; glowCtx.fillRect(centerX-baseR*1.5,centerY-baseR*1.5,baseR*3,baseR*3);

      const projected=[];
      for (let i=0;i<particles.length;i++) {
        const p=particles[i];
        const localWave = cfg.wobble*.032*Math.sin(t*.00125 + p.seed + p.y*5);
        const restless = state==='thinking' ? .025*Math.sin(t*.0034+p.seed*3) : 0;
        const speakingWave = speakingBoost*.08*Math.sin(p.seed*2.3+t*.006);
        const deform = spread + localWave + restless + speakingWave;
        const pp={x:p.x*deform,y:p.y*deform,z:p.z*deform};
        const [rx,ry,rz]=rotatePoint(pp,yaw + .08*Math.sin(p.seed+t*p.drift*.08),pitch);
        const depth=(rz+1.65)/3.3;
        const perspective=1/(1.11-rz*.18);
        const x=centerX+rx*baseR*perspective;
        const y=centerY+ry*baseR*perspective;
        projected.push({x,y,z:rz,depth,p});
      }
      projected.sort((a,b)=>a.z-b.z);

      for(const q of projected){
        const d=Math.max(.08,Math.min(1,q.depth));
        const pointAlpha=q.p.alpha*(.19+.73*d)*cfg.energy;
        const r=q.p.size*(.72+1.2*d)*(1+speakingBoost*.35);
        const hot = d>.62;
        cloudCtx.beginPath();
        cloudCtx.fillStyle = hot
          ? `rgba(127,222,255,${Math.min(.95,pointAlpha)})`
          : `rgba(40,157,222,${Math.min(.78,pointAlpha)})`;
        cloudCtx.arc(q.x,q.y,r,0,Math.PI*2); cloudCtx.fill();
      }

      // wenige, sehr dezente Verbindungen im vorderen Bereich
      if (state==='thinking' || state==='speaking') {
        cloudCtx.lineWidth=.55;
        for(let i=35;i<projected.length;i+=67){
          const a=projected[i], b=projected[(i+31)%projected.length];
          const dx=a.x-b.x, dy=a.y-b.y;
          if(dx*dx+dy*dy < baseR*baseR*.24){
            cloudCtx.strokeStyle=`rgba(86,196,244,${.035 + speakingBoost*.025})`;
            cloudCtx.beginPath(); cloudCtx.moveTo(a.x,a.y); cloudCtx.lineTo(b.x,b.y); cloudCtx.stroke();
          }
        }
      }

      requestAnimationFrame(draw);
    }

    let speechSenderId=null, speechChunks=[], speechExpectedChunks=0, speechMime='audio/mpeg', speechObjectUrl=null;
    function sendSpeechEvent(type, extra={}) {
      if (!speechSenderId) return;
      try { context.sendCustomMessage(NAMESPACE,speechSenderId,Object.assign({type},extra)); }
      catch(e){ console.warn('Speech event:',e); }
    }
    function speechBegin(senderId,data){
      speechSenderId=senderId; speechExpectedChunks=Number(data.chunks||0); speechMime=data.mime||'audio/mpeg';
      speechChunks=new Array(speechExpectedChunks); setState('speaking');
    }
    function speechChunk(data){ const i=Number(data.index); if(Number.isInteger(i)&&i>=0&&i<speechChunks.length) speechChunks[i]=data.data||''; }
    async function speechEnd(){
      try{
        if(!speechExpectedChunks || speechChunks.some(x=>typeof x!=='string')) throw new Error('TTS-Chunks unvollstaendig.');
        const binary=atob(speechChunks.join('')); const bytes=new Uint8Array(binary.length);
        for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
        if(speechObjectUrl) URL.revokeObjectURL(speechObjectUrl);
        speechObjectUrl=URL.createObjectURL(new Blob([bytes],{type:speechMime}));
        jarvisAudio.src=speechObjectUrl; jarvisAudio.currentTime=0; ensureAnalyser(); await jarvisAudio.play();
      }catch(err){ sendSpeechEvent('SPEAK_ERROR',{error:String(err)}); resetSpeech(); }
    }
    function resetSpeech(){ speechSenderId=null; speechChunks=[]; speechExpectedChunks=0; }
    jarvisAudio.addEventListener('playing',()=>{ setState('speaking'); sendSpeechEvent('SPEAK_STARTED'); });
    jarvisAudio.addEventListener('ended',()=>{ sendSpeechEvent('SPEAK_DONE'); setState('followup'); resetSpeech(); });
    jarvisAudio.addEventListener('error',()=>{ sendSpeechEvent('SPEAK_ERROR',{error:'HTMLAudioElement Fehler '+(jarvisAudio.error?.code||'unbekannt')}); setState('followup'); resetSpeech(); });

    function handleMessage(event){
      let data=event.data;
      if(typeof data==='string'){ try{data=JSON.parse(data);}catch(_){data={type:'SHOW_INFO',text:data};} }
      if(!data || typeof data!=='object') return;
      switch(data.type){
        case 'SHOW_STATE': setState(data.state||'active'); break;
        case 'SHOW_DIAGRAM': setState('thinking'); break; // bewusst nur Punktwolke
        case 'SHOW_INFO': if(state!=='speaking') setState('followup'); break;
        case 'SHOW_IDEAS': case 'SHOW_RECIPE': case 'SHOW_STEP': setState('active'); break;
        case 'STANDBY': case 'SHOW_STANDBY': setState('standby'); break;
        case 'SPEAK_BEGIN': speechBegin(event.senderId,data); break;
        case 'SPEAK_CHUNK': speechChunk(data); break;
        case 'SPEAK_END': speechEnd(); break;
      }
      if(data.type!=='SPEAK_CHUNK'){
        try{context.sendCustomMessage(NAMESPACE,event.senderId,{type:'ACK',receivedType:data.type||null});}catch(e){}
      }
    }

    window.addEventListener('resize',resize);
    resize(); createPointCloud(); requestAnimationFrame(draw);
    context.addCustomMessageListener(NAMESPACE,handleMessage);
    const options=new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout=true; options.statusText='JARVIS'; options.customNamespaces={};
    options.customNamespaces[NAMESPACE]=cast.framework.system.MessageType.JSON;
    context.start(options);
  </script>
</body>
</html>
