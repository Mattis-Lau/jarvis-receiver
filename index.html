<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JARVIS v1.30 Receiver</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    :root{--cyan:#62e5ff;--blue:#248bff;--ink:#02080d;--panel:#061722;--muted:#76aebc}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#01060a;color:#dffaff;font-family:Arial,sans-serif}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 48%,#0c3042 0,#04121b 34%,#01060a 74%),repeating-linear-gradient(0deg,transparent 0 3px,#5de4ff08 4px);pointer-events:none}
    #shell{position:absolute;inset:3.5vh 3vw;border:1px solid #5de4ff35;clip-path:polygon(0 22px,22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
    #shell:before,#shell:after{content:"";position:absolute;left:3%;right:3%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.45}#shell:before{top:5.8rem}#shell:after{bottom:3.7rem}
    header{height:5.8rem;padding:1.25rem 3%;display:flex;align-items:center;justify-content:space-between;letter-spacing:.16em}
    .brand{font-size:1.65rem;font-weight:600;text-shadow:0 0 18px #59ddff}.version,.telemetry{font-size:.72rem;color:var(--muted)}
    .orb{width:2.8rem;height:2.8rem;border:1px solid var(--cyan);border-radius:50%;box-shadow:0 0 22px #4bdcff88,inset 0 0 15px #4bdcff55;animation:pulse 2.4s ease-in-out infinite}
    main{position:absolute;left:3%;right:3%;top:6.6rem;bottom:4.5rem;display:grid;place-items:center}
    #dashboard{text-align:center}.core{width:24vw;height:24vw;max-width:370px;max-height:370px;border:1px solid #64e8ff55;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 70px #188ecb25,inset 0 0 70px #188ecb18;position:relative}.core:before,.core:after{content:"";position:absolute;border-radius:50%;border:2px dashed #5fe6ff44;inset:8%;animation:spin 18s linear infinite}.core:after{inset:21%;border-style:solid;border-width:1px;animation-direction:reverse;animation-duration:9s}.core h1{font-size:2.1rem;letter-spacing:.22em;margin:0}.core p{color:var(--muted);letter-spacing:.12em}
    #status{position:absolute;left:4%;bottom:5%;max-width:42%;text-align:left}#statusTitle{font-size:1.35rem;letter-spacing:.08em}#statusDetail{margin-top:.5rem;color:var(--muted)}
    #visual{position:absolute;inset:0;display:none;grid-template-rows:auto 1fr}.visual-head{padding:.5rem 1.5rem;color:#aeefff;font-size:.78rem;letter-spacing:.2em}.visual-stage{min-height:0;display:grid;place-items:center;position:relative}.visual-stage:before{content:"";position:absolute;inset:2%;border:1px solid #59ddff19;background:linear-gradient(90deg,#5ce4ff12 1px,transparent 1px),linear-gradient(#5ce4ff12 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle,#000 25%,transparent 78%)}#svgHost{position:absolute;inset:0;display:grid;place-items:center}#svgHost svg{width:100%;height:100%;filter:drop-shadow(0 0 10px #27cfff29)}
    #loading{font-size:1rem;letter-spacing:.24em;color:var(--cyan);animation:pulse 1.2s infinite}.hidden{display:none!important}
    footer{position:absolute;left:3%;right:3%;bottom:1.25rem;display:flex;justify-content:space-between;font-size:.65rem;color:#6096a3;letter-spacing:.12em}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.45;transform:scale(.985)}}
  </style>
</head>
<body>
  <div id="shell">
    <header><div><div class="brand">J.A.R.V.I.S.</div><div class="version">NEURAL INTERFACE // v1.30</div></div><div class="orb"></div><div class="telemetry">SYSTEM ONLINE<br>PCM 24 KHZ // LIVE</div></header>
    <main>
      <section id="dashboard"><div class="core"><div><h1>JARVIS</h1><p>READY</p></div></div></section>
      <section id="visual"><div class="visual-head" id="visualTitle">JARVIS // TECHNICAL VISUAL</div><div class="visual-stage"><div id="loading">ANALYSIERE SYSTEMSTRUKTUR …</div><div id="svgHost"></div></div></section>
      <div id="status"><div id="statusTitle">Bereit</div><div id="statusDetail">Warte auf Aktivierung.</div></div>
    </main>
    <footer><span>VOICE LINK // ECHO-GATED BARGE-IN</span><span id="clock"></span></footer>
  </div>
<script>
(() => {
  'use strict';
  const NS='urn:x-cast:com.jarvis.receiver';
  const dashboard=document.getElementById('dashboard'), visual=document.getElementById('visual');
  const svgHost=document.getElementById('svgHost'), loading=document.getElementById('loading');
  let svgChunks=[], audioCtx=null, nextAudioTime=0, sources=new Set(), live=false;
  const send=(senderId,type,extra={})=>{try{cast.framework.CastReceiverContext.getInstance().sendCustomMessage(NS,senderId,{type,...extra})}catch(_) {}};
  const showVisual=(title)=>{dashboard.style.display='none';visual.style.display='grid';document.getElementById('visualTitle').textContent=title||'JARVIS // TECHNICAL VISUAL';};
  const showDashboard=()=>{visual.style.display='none';dashboard.style.display='block';svgHost.replaceChildren();};
  const hardStop=()=>{live=false;sources.forEach(s=>{try{s.stop(0)}catch(_){}});sources.clear();nextAudioTime=0;if(audioCtx){try{audioCtx.close()}catch(_){}audioCtx=null;}};
  const beginAudio=(rate)=>{hardStop();audioCtx=new AudioContext({sampleRate:Number(rate)||24000,latencyHint:'interactive'});nextAudioTime=audioCtx.currentTime+.035;live=true;};
  const playPcm=(b64)=>{if(!live||!audioCtx)return;const bin=atob(b64),count=bin.length>>1,buf=audioCtx.createBuffer(1,count,24000),out=buf.getChannelData(0);for(let i=0,j=0;i<count;i++,j+=2){let v=bin.charCodeAt(j)|(bin.charCodeAt(j+1)<<8);if(v&0x8000)v-=0x10000;out[i]=v/32768}const src=audioCtx.createBufferSource();src.buffer=buf;src.connect(audioCtx.destination);const at=Math.max(nextAudioTime,audioCtx.currentTime+.012);src.start(at);nextAudioTime=at+buf.duration;sources.add(src);src.onended=()=>sources.delete(src);};
  const finishAudio=(senderId)=>{live=false;const remaining=Math.max(0,nextAudioTime-(audioCtx?audioCtx.currentTime:0));setTimeout(()=>send(senderId,'SPEAK_DONE'),remaining*1000+30);};
  const safeSvg=(raw)=>{const doc=new DOMParser().parseFromString(raw,'image/svg+xml');if(doc.querySelector('parsererror'))return null;doc.querySelectorAll('script,foreignObject,image,use').forEach(n=>n.remove());doc.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{if(/^on/i.test(a.name)||/href$/i.test(a.name))el.removeAttribute(a.name)}));return document.importNode(doc.documentElement,true);};
  const context=cast.framework.CastReceiverContext.getInstance();
  context.addCustomMessageListener(NS,e=>{const m=typeof e.data==='string'?JSON.parse(e.data):e.data||{};switch(m.type){
    case 'LIVE_AUDIO_BEGIN':beginAudio(m.sample_rate);send(e.senderId,'SPEAK_STARTED');break;
    case 'LIVE_AUDIO_CHUNK':playPcm(m.data);break;
    case 'LIVE_AUDIO_END':finishAudio(e.senderId);break;
    case 'LIVE_AUDIO_STOP':hardStop();send(e.senderId,'SPEAK_DONE',{interrupted:true});break;
    case 'SHOW_VISUAL_LOADING':showVisual(m.title);loading.classList.remove('hidden');svgHost.replaceChildren();break;
    case 'SHOW_SVG_BEGIN':showVisual(m.title);svgChunks=[];break;
    case 'SHOW_SVG_CHUNK':svgChunks[Number(m.index)||0]=m.data||'';break;
    case 'SHOW_SVG_END':{const node=safeSvg(svgChunks.join(''));if(node){svgHost.replaceChildren(node);loading.classList.add('hidden')}break;}
    case 'HIDE_VISUAL':case 'SHOW_DASHBOARD':showDashboard();break;
    case 'SHOW_STATE':document.getElementById('statusTitle').textContent=m.status||m.title||'JARVIS';document.getElementById('statusDetail').textContent=m.detail||'';break;
    case 'SHOW_INFO':document.getElementById('statusTitle').textContent=m.title||'JARVIS';document.getElementById('statusDetail').textContent=m.text||m.detail||'';break;
  }});
  context.start({disableIdleTimeout:true});
  setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('de-DE')+' // EUROPE BERLIN',1000);
})();
</script>
</body>
</html>
