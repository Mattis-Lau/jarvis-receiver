<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JARVIS Receiver</title>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(rgba(70, 183, 231, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(70, 183, 231, .025) 1px, transparent 1px),
        radial-gradient(circle at 50% 38%, rgba(36, 150, 205, .15), transparent 38%),
        linear-gradient(180deg, #06111b 0%, #02070c 100%);
      background-size: 4.5vw 4.5vw, 4.5vw 4.5vw, auto, auto;
      color: #eaf8ff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 3.2vh 3.6vw 2.6vh;
    }

    .top {
      height: 10vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(111,211,255,.28);
    }

    .brand {
      font-size: 2.2vw;
      letter-spacing: .65vw;
      font-weight: 700;
      white-space: nowrap;
    }

    .online {
      font-size: 1.05vw;
      letter-spacing: .16vw;
      color: #86dcff;
      white-space: nowrap;
    }

    .dot {
      display: inline-block;
      width: .6vw;
      height: .6vw;
      border-radius: 50%;
      background: #86dcff;
      margin-right: .65vw;
      box-shadow: 0 0 16px #86dcff;
    }

    main {
      height: 82vh;
      padding-top: 3.5vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      max-width: none;
      margin: 0;
    }

    .eyebrow {
      color: #78d4ff;
      font-size: 1vw;
      letter-spacing: .25vw;
      text-transform: uppercase;
      margin-bottom: 1.2vh;
      flex: 0 0 auto;
    }

    h1 {
      font-size: 3.3vw;
      line-height: 1.08;
      margin: 0 0 1.1vh;
      font-weight: 500;
      flex: 0 0 auto;
    }

    .subtitle {
      font-size: 1.55vw;
      line-height: 1.25;
      color: #aac4d1;
      margin-bottom: 2.5vh;
      flex: 0 0 auto;
    }

    .hint {
      margin-top: 1.7vh;
      font-size: 1.05vw;
      color: #78d4ff;
      flex: 0 0 auto;
    }

    .grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2.2vh 1.55vw;
      margin-top: .4vh;
    }

    .card {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(85, 209, 255, .42);
      background:
        linear-gradient(135deg, rgba(15, 46, 67, .88), rgba(5, 18, 30, .76));
      border-radius: 1.05vw;
      padding: 1.7vh 1.55vw 1.45vh;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.025),
        0 0 2.1vw rgba(26, 167, 224, .07);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: .22vw;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(93, 222, 255, .95),
        rgba(66, 132, 255, .28)
      );
      box-shadow: 0 0 1vw rgba(73, 211, 255, .48);
    }

    .card::after {
      content: "";
      position: absolute;
      right: -4vw;
      top: -7vh;
      width: 13vw;
      height: 13vw;
      border: 1px solid rgba(94, 216, 255, .10);
      border-radius: 50%;
      box-shadow:
        0 0 0 1.4vw rgba(75, 176, 227, .025),
        0 0 0 3vw rgba(75, 176, 227, .018);
      pointer-events: none;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .7vh;
      position: relative;
      z-index: 1;
    }

    .num {
      color: #82e3ff;
      font-size: .88vw;
      letter-spacing: .22vw;
      font-weight: 700;
    }

    .card-meta {
      display: flex;
      gap: .45vw;
      align-items: center;
    }

    .chip {
      border: 1px solid rgba(102, 212, 255, .28);
      background: rgba(70, 182, 232, .08);
      color: #9edfff;
      border-radius: 999px;
      padding: .36vh .55vw;
      font-size: .68vw;
      letter-spacing: .045vw;
      white-space: nowrap;
    }

    .card-title {
      position: relative;
      z-index: 1;
      font-size: 1.72vw;
      line-height: 1.04;
      font-weight: 600;
      margin: .15vh 0 .7vh;
      color: #f4fbff;
      max-width: 86%;
    }

    .desc {
      position: relative;
      z-index: 1;
      font-size: .95vw;
      line-height: 1.28;
      color: #a9c7d6;
      max-width: 94%;
      min-height: 2.4em;
      overflow: hidden;
    }

    .ingredients {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding-top: .75vh;
      display: flex;
      gap: .42vw;
      flex-wrap: wrap;
      border-top: 1px solid rgba(107, 207, 247, .11);
    }

    .ingredient {
      color: #d7f4ff;
      background: rgba(113, 211, 255, .055);
      border-radius: .36vw;
      padding: .34vh .45vw;
      font-size: .72vw;
      white-space: nowrap;
    }

    .text {
      font-size: 1.4vw;
      line-height: 1.45;
      color: #c8dce6;
      white-space: pre-wrap;
      overflow: hidden;
    }

    .step {
      border-left: 3px solid #75d8ff;
      padding-left: 1.6vw;
      margin-top: 1vh;
    }

    #jarvisAudio {
      display: none;
    }

    #debug {
      position: fixed;
      right: 1.2vw;
      bottom: .8vh;
      font-size: .7vw;
      color: rgba(135,220,255,.42);
      pointer-events: none;
    }

    /* Rezeptansicht */
    .recipe-layout {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: .85fr 1.35fr;
      gap: 2vw;
    }

    .recipe-panel {
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(111,211,255,.30);
      background: rgba(11,35,50,.52);
      border-radius: 1.1vw;
      padding: 2.2vh 1.8vw;
    }

    .recipe-panel h2 {
      margin: 0 0 1.4vh;
      color: #78d4ff;
      font-size: 1.5vw;
      font-weight: 500;
    }

    .recipe-panel ul,
    .recipe-panel ol {
      margin: 0;
      padding-left: 1.5vw;
      font-size: 1.18vw;
      line-height: 1.42;
    }

    .recipe-panel li {
      margin-bottom: .7vh;
    }
  
    /* ===== JARVIS POINT CLOUD HUD ===== */
    .jarvis-hud {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 46%, rgba(7,28,45,.96), rgba(2,8,14,.99) 52%, #02060a 100%);
      color: #e4f8ff;
    }

    .jarvis-hud.visible { display: block; }

    body.hud-active #app,
    body.hud-active .app,
    body.hud-active main,
    body.hud-active header,
    body.hud-active footer {
      visibility: hidden !important;
    }

    #pointCloudCanvas {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    .hud-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, transparent 0 32%, rgba(0,0,0,.16) 58%, rgba(0,0,0,.78) 100%);
      pointer-events: none;
    }

    .hud-scan {
      position: absolute;
      inset: 0;
      opacity: .10;
      background: repeating-linear-gradient(
        to bottom,
        rgba(110,220,255,.14) 0,
        rgba(110,220,255,.14) 1px,
        transparent 1px,
        transparent 5px
      );
      pointer-events: none;
    }

    .hud-meta {
      position: absolute;
      top: 42px;
      left: 52px;
      font-size: 14px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(121,218,255,.56);
    }

    .hud-meta.right {
      left: auto;
      right: 52px;
      text-align: right;
    }

    .hud-status-wrap {
      position: absolute;
      left: 50%;
      bottom: 76px;
      transform: translateX(-50%);
      width: min(84vw, 1350px);
      text-align: center;
    }

    .hud-status {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: .20em;
      text-transform: uppercase;
      color: rgba(195,242,255,.98);
      text-shadow: 0 0 18px rgba(70,200,255,.42);
    }

    .hud-detail {
      margin-top: 15px;
      font-size: 30px;
      line-height: 1.35;
      color: rgba(235,248,252,.90);
      max-height: 2.8em;
      overflow: hidden;
      text-shadow: 0 0 14px rgba(50,180,255,.22);
    }

    .hud-state-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, 210px);
      font-size: 12px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(100,207,255,.35);
    }

  </style>
</head>

<body>
  <audio id="jarvisAudio" preload="auto"></audio>
  <header class="top">
    <div class="brand">JARVIS</div>
    <div class="online"><span class="dot"></span>SYSTEM ONLINE</div>
  </header>

  <main id="main">
    <div class="eyebrow">ASSISTENT</div>
    <h1>Bereit.</h1>
    <div class="subtitle">Warte auf eine Anfrage.</div>
    <div class="hint">ONLINE</div>
  </main>

  <div id="debug">Receiver gestartet</div>

  <script>
    const NAMESPACE = 'urn:x-cast:com.jarvis.receiver';
    const context = cast.framework.CastReceiverContext.getInstance();
    const main = document.getElementById('main');
    const debug = document.getElementById('debug');

    function esc(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setDebug(text) {
      debug.textContent = text;
      console.log('[JARVIS]', text);
    }

    function showStandby(data = {}) {
      main.innerHTML = `
        <div class="eyebrow">${esc(data.eyebrow || 'ASSISTENT')}</div>
        <h1>${esc(data.title || 'Bereit.')}</h1>
        <div class="subtitle">${esc(data.subtitle || 'Warte auf eine Anfrage.')}</div>
        <div class="hint">${esc(data.hint || 'ONLINE')}</div>
      `;
    }

    function showIdeas(data) {
      const items = Array.isArray(data.items) ? data.items.slice(0, 4) : [];

      main.innerHTML = `
        <div class="eyebrow">CULINARY // OPTIONS</div>
        <h1>${esc(data.title || 'Was möchtest du kochen?')}</h1>
        <div class="subtitle">${esc(data.subtitle || '')}</div>

        <div class="grid">
          ${items.map((item, i) => {
            const ingredients = Array.isArray(item.ingredients)
              ? item.ingredients.slice(0, 3)
              : [];

            return `
              <div class="card">
                <div class="card-head">
                  <div class="num">OPTION 0${i + 1}</div>
                  <div class="card-meta">
                    ${item.duration ? `<span class="chip">${esc(item.duration)}</span>` : ''}
                    ${item.difficulty ? `<span class="chip">${esc(item.difficulty)}</span>` : ''}
                  </div>
                </div>

                <div class="card-title">${esc(item.title || item.titel || '')}</div>
                <div class="desc">${esc(item.description || item.beschreibung || '')}</div>

                ${ingredients.length ? `
                  <div class="ingredients">
                    ${ingredients.map(x => `<span class="ingredient">${esc(x)}</span>`).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>

        <div class="hint">${esc(data.hint || 'Sag einfach die Nummer.')}</div>
      `;
    }

    function showRecipe(data) {
      const ingredients = Array.isArray(data.ingredients)
        ? data.ingredients
        : (Array.isArray(data.zutaten) ? data.zutaten : []);

      const steps = Array.isArray(data.steps)
        ? data.steps
        : (Array.isArray(data.schritte) ? data.schritte : []);

      if (ingredients.length || steps.length) {
        main.innerHTML = `
          <div class="eyebrow">REZEPT</div>
          <h1>${esc(data.title || data.titel || 'Rezept')}</h1>
          <div class="subtitle">${esc(data.subtitle || '')}</div>

          <div class="recipe-layout">
            <section class="recipe-panel">
              <h2>Zutaten</h2>
              <ul>
                ${ingredients.map(x => `<li>${esc(x)}</li>`).join('')}
              </ul>
            </section>

            <section class="recipe-panel">
              <h2>Zubereitung</h2>
              <ol>
                ${steps.map(x => `<li>${esc(x)}</li>`).join('')}
              </ol>
            </section>
          </div>

          <div class="hint">${esc(data.hint || 'Sag „nächster Schritt“ zum Fortfahren.')}</div>
        `;
      } else {
        main.innerHTML = `
          <div class="eyebrow">REZEPT</div>
          <h1>${esc(data.title || 'Rezept')}</h1>
          <div class="subtitle">${esc(data.subtitle || '')}</div>
          <div class="text">${esc(data.text || data.content || '')}</div>
          <div class="hint">${esc(data.hint || 'Sag „nächster Schritt“ zum Fortfahren.')}</div>
        `;
      }
    }

    function showStep(data) {
      main.innerHTML = `
        <div class="eyebrow">SCHRITT ${esc(data.step || '')}</div>
        <h1>${esc(data.title || 'Zubereitung')}</h1>
        <div class="step">
          <div class="text">${esc(data.text || data.content || '')}</div>
        </div>
        <div class="hint">${esc(data.hint || 'Sag „weiter“, wenn du bereit bist.')}</div>
      `;
    }

    function showInfo(data) {
      main.innerHTML = `
        <div class="eyebrow">${esc(data.eyebrow || 'INFORMATION')}</div>
        <h1>${esc(data.title || 'JARVIS')}</h1>
        <div class="text">${esc(data.text || data.content || '')}</div>
        <div class="hint">${esc(data.hint || '')}</div>
      `;
    }

    const jarvisAudio = document.getElementById('jarvisAudio');

    let speechSenderId = null;
    let speechChunks = [];
    let speechExpectedChunks = 0;
    let speechMime = 'audio/mpeg';
    let speechObjectUrl = null;

    function sendSpeechEvent(type, extra = {}) {
      if (!speechSenderId) return;

      try {
        context.sendCustomMessage(
          NAMESPACE,
          speechSenderId,
          Object.assign(
            { type },
            extra
          )
        );
      } catch (err) {
        console.warn(
          'JARVIS Speech Event konnte nicht gesendet werden:',
          err
        );
      }
    }

    function speechBegin(senderId, data) {
      speechSenderId = senderId;
      speechExpectedChunks = Number(data.chunks || 0);
      speechMime = data.mime || 'audio/mpeg';
      speechChunks = new Array(speechExpectedChunks);

      setDebug(
        'TTS empfangen: 0/' + speechExpectedChunks
      );
    }

    function speechChunk(data) {
      const index = Number(data.index);

      if (
        Number.isInteger(index) &&
        index >= 0 &&
        index < speechChunks.length
      ) {
        speechChunks[index] = data.data || '';
      }
    }

    async function speechEnd() {
      try {
        if (
          !speechExpectedChunks ||
          speechChunks.some(chunk => typeof chunk !== 'string')
        ) {
          throw new Error(
            'TTS-Chunks unvollstaendig.'
          );
        }

        const base64 = speechChunks.join('');
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        if (speechObjectUrl) {
          URL.revokeObjectURL(speechObjectUrl);
        }

        const blob = new Blob(
          [bytes],
          { type: speechMime }
        );

        speechObjectUrl = URL.createObjectURL(blob);

        jarvisAudio.src = speechObjectUrl;
        jarvisAudio.currentTime = 0;

        setDebug('TTS wird abgespielt');

        await jarvisAudio.play();

      } catch (err) {
        console.error(
          'JARVIS Audio Error:',
          err
        );

        sendSpeechEvent(
          'SPEAK_ERROR',
          { error: String(err) }
        );

        speechSenderId = null;
        speechChunks = [];
        speechExpectedChunks = 0;
      }
    }

    jarvisAudio.addEventListener(
      'playing',
      () => {
        setDebug('TTS spielt');
        sendSpeechEvent('SPEAK_STARTED');
      }
    );

    jarvisAudio.addEventListener(
      'ended',
      () => {
        setDebug('TTS beendet');
        sendSpeechEvent('SPEAK_DONE');
        setHudState(
          'followup',
          'Bereit',
          'Du kannst direkt weitersprechen.'
        );

        speechSenderId = null;
        speechChunks = [];
        speechExpectedChunks = 0;
      }
    );

    jarvisAudio.addEventListener(
      'error',
      () => {
        const code =
          jarvisAudio.error?.code ??
          'unbekannt';

        sendSpeechEvent(
          'SPEAK_ERROR',
          {
            error:
              'HTMLAudioElement Fehlercode ' +
              String(code)
          }
        );

        speechSenderId = null;
        speechChunks = [];
        speechExpectedChunks = 0;
      }
    );


    const hudCanvas = document.getElementById('pointCloudCanvas');
    const hudCtx = hudCanvas ? hudCanvas.getContext('2d') : null;
    let hudState = 'standby';
    let hudParticles = [];
    let hudTime = 0;

    function resizeHudCanvas() {
      if (!hudCanvas || !hudCtx) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      hudCanvas.width = Math.floor(window.innerWidth * dpr);
      hudCanvas.height = Math.floor(window.innerHeight * dpr);
      hudCanvas.style.width = window.innerWidth + 'px';
      hudCanvas.style.height = window.innerHeight + 'px';
      hudCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function createPointCloud() {
      hudParticles = [];
      const count = 950;

      for (let i = 0; i < count; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = 2 * Math.PI * u;
        const phi = Math.acos(2 * v - 1);
        const radius = 145 + (Math.random() - .5) * 36;

        hudParticles.push({
          x: radius * Math.sin(phi) * Math.cos(theta),
          y: radius * Math.sin(phi) * Math.sin(theta),
          z: radius * Math.cos(phi),
          seed: Math.random() * 1000,
          size: .65 + Math.random() * 1.45
        });
      }
    }

    function hudParams() {
      switch (hudState) {
        case 'listening':
          return { speed: .010, jitter: 4.2, pulse: 18, glow: 1.20 };
        case 'transcribing':
          return { speed: .016, jitter: 2.2, pulse: 10, glow: 1.10 };
        case 'thinking':
          return { speed: .032, jitter: 3.2, pulse: 14, glow: 1.38 };
        case 'speaking':
          return { speed: .019, jitter: 5.0, pulse: 28, glow: 1.52 };
        case 'understood':
          return { speed: .009, jitter: 1.2, pulse: 8, glow: 1.28 };
        case 'followup':
          return { speed: .008, jitter: 2.0, pulse: 11, glow: 1.10 };
        default:
          return { speed: .005, jitter: .7, pulse: 6, glow: .88 };
      }
    }

    function drawPointCloud() {
      if (!hudCtx || !hudCanvas) {
        requestAnimationFrame(drawPointCloud);
        return;
      }

      const w = window.innerWidth;
      const h = window.innerHeight;
      const cx = w / 2;
      const cy = h * .45;
      const p = hudParams();

      hudTime += p.speed;
      hudCtx.clearRect(0, 0, w, h);

      const rotY = hudTime;
      const rotX = Math.sin(hudTime * .42) * .32;
      const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
      const pulse = Math.sin(hudTime * 4.3) * p.pulse;

      const points = [];

      for (const pt of hudParticles) {
        const breathing = 1 + Math.sin(hudTime * 3.1 + pt.seed) * .018;
        let x = pt.x * breathing;
        let y = pt.y * breathing;
        let z = pt.z * breathing;

        const x1 = x * cosY - z * sinY;
        const z1 = x * sinY + z * cosY;
        const y1 = y * cosX - z1 * sinX;
        const z2 = y * sinX + z1 * cosX;

        const jitter = Math.sin(pt.seed + hudTime * 8.2) * p.jitter;
        const scale = 440 / (440 + z2);

        points.push({
          x: cx + (x1 + jitter) * scale,
          y: cy + (y1 + jitter * .42) * scale,
          z: z2,
          scale,
          size: pt.size
        });
      }

      points.sort((a, b) => a.z - b.z);

      hudCtx.save();
      hudCtx.globalCompositeOperation = 'lighter';

      for (const q of points) {
        const depth = Math.max(.12, Math.min(1, (q.z + 190) / 380));
        const alpha = Math.min(.92, (.15 + depth * .62) * p.glow);
        const radius = Math.max(.65, q.size * q.scale * (.72 + depth * .82));

        hudCtx.beginPath();
        hudCtx.fillStyle = `rgba(95, 218, 255, ${alpha})`;
        hudCtx.shadowColor = 'rgba(50, 190, 255, .85)';
        hudCtx.shadowBlur = 7 * p.glow;
        hudCtx.arc(q.x, q.y, radius, 0, Math.PI * 2);
        hudCtx.fill();
      }

      hudCtx.restore();

      const halo = hudCtx.createRadialGradient(cx, cy, 20, cx, cy, 210 + pulse);
      halo.addColorStop(0, 'rgba(115,225,255,.055)');
      halo.addColorStop(.5, 'rgba(40,160,255,.025)');
      halo.addColorStop(1, 'rgba(10,80,150,0)');
      hudCtx.fillStyle = halo;
      hudCtx.beginPath();
      hudCtx.arc(cx, cy, 215 + pulse, 0, Math.PI * 2);
      hudCtx.fill();

      requestAnimationFrame(drawPointCloud);
    }

    function setHudState(state, status, detail) {
      const hud = document.getElementById('jarvisHud');
      const statusEl = document.getElementById('hudStatus');
      const detailEl = document.getElementById('hudDetail');
      const stateEl = document.getElementById('hudStateLabel');

      if (!hud || !statusEl || !detailEl) return;

      document.body.classList.add('hud-active');
      hud.classList.add('visible');

      hudState = state || 'active';
      hud.dataset.state = hudState;
      statusEl.textContent = status || 'JARVIS';
      detailEl.textContent = detail || '';

      if (stateEl) {
        stateEl.textContent = String(hudState).toUpperCase() + ' // CORE ACTIVE';
      }
    }

    function hideHud() {
      document.body.classList.remove('hud-active');
      const hud = document.getElementById('jarvisHud');
      if (hud) hud.classList.remove('visible');
    }

    setInterval(() => {
      const el = document.getElementById('hudClock');
      if (!el) return;
      el.textContent =
        new Date().toLocaleTimeString('de-DE', { hour12: false }) +
        ' // SYSTEM ONLINE';
    }, 1000);

    window.addEventListener('resize', resizeHudCanvas);
    resizeHudCanvas();
    createPointCloud();
    requestAnimationFrame(drawPointCloud);

    function handleMessage(event) {
      let data = event.data;

      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (_) {
          data = { type: 'SHOW_INFO', text: data };
        }
      }

      if (!data || typeof data !== 'object') return;

      setDebug('Empfangen: ' + (data.type || 'unbekannt'));

      switch (data.type) {
        case 'SHOW_IDEAS':
          hideHud();
          showIdeas(data);
          break;

        case 'SHOW_RECIPE':
          hideHud();
          showRecipe(data);
          break;

        case 'SHOW_STEP':
          showStep(data);
          break;

        case 'SHOW_STATE':
          setHudState(
            data.state || 'active',
            data.status || data.title || 'JARVIS',
            data.detail || ''
          );
          break;

        case 'SHOW_INFO':
          hideHud();
          showInfo(data);
          break;

        case 'STANDBY':
        case 'SHOW_STANDBY':
          showStandby(data);
          break;

        case 'SPEAK_BEGIN':
          setHudState(
            'speaking',
            'Spreche',
            document.getElementById('hudDetail')?.textContent || ''
          );
          speechBegin(
            event.senderId,
            data
          );
          break;

        case 'SPEAK_CHUNK':
          speechChunk(data);
          break;

        case 'SPEAK_END':
          speechEnd();
          break;

        default:
          showInfo({
            title: 'Nachricht empfangen',
            text: JSON.stringify(data, null, 2)
          });
      }

      if (data.type !== 'SPEAK_CHUNK') {
        try {
          context.sendCustomMessage(
            NAMESPACE,
            event.senderId,
            { type: 'ACK', receivedType: data.type || null }
          );
        } catch (err) {
          console.warn('ACK konnte nicht gesendet werden:', err);
        }
      }
    }

    context.addCustomMessageListener(NAMESPACE, handleMessage);

    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    options.statusText = 'JARVIS bereit';
    options.customNamespaces = {};
    options.customNamespaces[NAMESPACE] =
      cast.framework.system.MessageType.JSON;

    context.start(options);
    setDebug('JARVIS Receiver bereit');
  </script>

  <div id="jarvisHud" class="jarvis-hud" data-state="standby">
    <canvas id="pointCloudCanvas"></canvas>
    <div class="hud-vignette"></div>
    <div class="hud-scan"></div>
    <div class="hud-meta">JARVIS // NEURAL INTERFACE</div>
    <div class="hud-meta right" id="hudClock">SYSTEM ONLINE</div>
    <div class="hud-state-label" id="hudStateLabel">CORE ONLINE</div>
    <div class="hud-status-wrap">
      <div id="hudStatus" class="hud-status">Bereit</div>
      <div id="hudDetail" class="hud-detail">Warte auf eine Anfrage.</div>
    </div>
  </div>

</body>
</html>
