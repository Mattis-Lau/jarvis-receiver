<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JARVIS Receiver</title>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(38,142,190,.13), transparent 34%),
        linear-gradient(180deg, #06101a 0%, #02070c 100%);
      color: #eaf8ff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    body { padding: 54px 70px; }
    .top {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(111,211,255,.28);
      padding-bottom: 24px;
    }
    .brand { font-size: 40px; letter-spacing: 13px; font-weight: 700; }
    .online { font-size: 19px; letter-spacing: 3px; color: #86dcff; }
    .dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      background: #86dcff; margin-right: 12px;
      box-shadow: 0 0 16px #86dcff;
    }
    main {
      height: calc(100% - 90px);
      display: flex; flex-direction: column; justify-content: center;
      max-width: 1500px; margin: 0 auto;
    }
    .eyebrow {
      color: #78d4ff; font-size: 18px; letter-spacing: 5px;
      text-transform: uppercase; margin-bottom: 18px;
    }
    h1 { font-size: 58px; margin: 0 0 16px; font-weight: 500; }
    .subtitle { font-size: 27px; color: #aac4d1; margin-bottom: 36px; }
    .hint { margin-top: 32px; font-size: 21px; color: #78d4ff; }
    .grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 22px; margin-top: 12px;
    }
    .card {
      border: 1px solid rgba(111,211,255,.34);
      background: rgba(11,35,50,.62);
      border-radius: 18px; padding: 25px 28px;
      min-height: 132px;
    }
    .num {
      color: #72d5ff; font-size: 20px; letter-spacing: 3px;
      margin-bottom: 9px;
    }
    .card-title { font-size: 30px; margin-bottom: 8px; }
    .desc { font-size: 20px; line-height: 1.4; color: #a9c0cb; }
    .text {
      font-size: 25px; line-height: 1.55; color: #c8dce6;
      white-space: pre-wrap; max-width: 1200px;
    }
    .step {
      border-left: 3px solid #75d8ff;
      padding-left: 28px; margin-top: 10px;
    }
    #debug {
      position: fixed; bottom: 16px; right: 22px;
      font-size: 13px; color: rgba(135,220,255,.55);
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="brand">JARVIS</div>
    <div class="online"><span class="dot"></span>SYSTEM ONLINE</div>
  </header>

  <main id="main">
    <div class="eyebrow">ASSISTENT</div>
    <h1>Bereit.</h1>
    <div class="subtitle">Warte auf eine Anfrage.</div>
    <div class="hint">ONLINE</div>
  </main>

  <div id="debug">Receiver gestartet</div>

  <script>
    const NAMESPACE = 'urn:x-cast:com.jarvis.receiver';
    const context = cast.framework.CastReceiverContext.getInstance();
    const main = document.getElementById('main');
    const debug = document.getElementById('debug');

    function esc(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setDebug(text) {
      debug.textContent = text;
      console.log('[JARVIS]', text);
    }

    function showStandby(data = {}) {
      main.innerHTML = `
        <div class="eyebrow">${esc(data.eyebrow || 'ASSISTENT')}</div>
        <h1>${esc(data.title || 'Bereit.')}</h1>
        <div class="subtitle">${esc(data.subtitle || 'Warte auf eine Anfrage.')}</div>
        <div class="hint">${esc(data.hint || 'ONLINE')}</div>
      `;
    }

    function showIdeas(data) {
      const items = Array.isArray(data.items) ? data.items : [];
      main.innerHTML = `
        <div class="eyebrow">REZEPTIDEEN</div>
        <h1>${esc(data.title || 'Was möchtest du kochen?')}</h1>
        <div class="subtitle">${esc(data.subtitle || '')}</div>
        <div class="grid">
          ${items.map((item, i) => `
            <div class="card">
              <div class="num">0${i + 1}</div>
              <div class="card-title">${esc(item.title || '')}</div>
              <div class="desc">${esc(item.description || '')}</div>
            </div>
          `).join('')}
        </div>
        <div class="hint">${esc(data.hint || 'Sag einfach die Nummer.')}</div>
      `;
    }

    function showRecipe(data) {
      main.innerHTML = `
        <div class="eyebrow">REZEPT</div>
        <h1>${esc(data.title || 'Rezept')}</h1>
        <div class="subtitle">${esc(data.subtitle || '')}</div>
        <div class="text">${esc(data.text || data.content || '')}</div>
        <div class="hint">${esc(data.hint || 'Sag „nächster Schritt“ zum Fortfahren.')}</div>
      `;
    }

    function showStep(data) {
      main.innerHTML = `
        <div class="eyebrow">SCHRITT ${esc(data.step || '')}</div>
        <h1>${esc(data.title || 'Zubereitung')}</h1>
        <div class="step">
          <div class="text">${esc(data.text || data.content || '')}</div>
        </div>
        <div class="hint">${esc(data.hint || 'Sag „weiter“, wenn du bereit bist.')}</div>
      `;
    }

    function showInfo(data) {
      main.innerHTML = `
        <div class="eyebrow">${esc(data.eyebrow || 'INFORMATION')}</div>
        <h1>${esc(data.title || 'JARVIS')}</h1>
        <div class="text">${esc(data.text || data.content || '')}</div>
        <div class="hint">${esc(data.hint || '')}</div>
      `;
    }

    function handleMessage(event) {
      let data = event.data;

      if (typeof data === 'string') {
        try { data = JSON.parse(data); }
        catch (_) { data = { type: 'SHOW_INFO', text: data }; }
      }

      if (!data || typeof data !== 'object') return;

      setDebug('Empfangen: ' + (data.type || 'unbekannt'));

      switch (data.type) {
        case 'SHOW_IDEAS':
          showIdeas(data);
          break;
        case 'SHOW_RECIPE':
          showRecipe(data);
          break;
        case 'SHOW_STEP':
          showStep(data);
          break;
        case 'SHOW_INFO':
          showInfo(data);
          break;
        case 'STANDBY':
        case 'SHOW_STANDBY':
          showStandby(data);
          break;
        case 'SPEAK':
          // Die eigentliche TTS-Wiedergabe übernimmt vorerst Python.
          if (data.text) showInfo({
            title: data.title || 'JARVIS',
            text: data.text
          });
          break;
        default:
          showInfo({
            title: 'Nachricht empfangen',
            text: JSON.stringify(data, null, 2)
          });
      }

      // Antwort an den Sender; hilfreich fürs Debugging.
      try {
        context.sendCustomMessage(
          NAMESPACE,
          event.senderId,
          { type: 'ACK', receivedType: data.type || null }
        );
      } catch (err) {
        console.warn('ACK konnte nicht gesendet werden:', err);
      }
    }

    // Namespace VOR context.start() registrieren.
    context.addCustomMessageListener(NAMESPACE, handleMessage);

    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    options.statusText = 'JARVIS bereit';
    options.customNamespaces = {};
    options.customNamespaces[NAMESPACE] =
      cast.framework.system.MessageType.JSON;

    context.start(options);
    setDebug('JARVIS Receiver bereit');
  </script>
</body>
</html>
