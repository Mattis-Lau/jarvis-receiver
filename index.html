<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JARVIS Receiver Minimal</title>

  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #07101a;
      color: #eaf7ff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .box {
      text-align: center;
      border: 2px solid #63c7ff;
      border-radius: 24px;
      padding: 64px 88px;
      box-shadow: 0 0 40px rgba(99,199,255,.25);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 64px;
      letter-spacing: 8px;
    }

    p {
      margin: 0;
      font-size: 30px;
      color: #a4e4ff;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>JARVIS</h1>
    <p>RECEIVER ONLINE</p>
  </div>

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const options = new cast.framework.CastReceiverOptions();

    options.disableIdleTimeout = true;
    options.statusText = 'JARVIS Receiver Online';

    context.start(options);
  </script>
</body>
</html>
