<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>JARVIS v1.40</title>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
:root{--cyan:#57e6ff;--blue:#168cba;--ink:#02070b;--line:rgba(87,230,255,.28)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#010508;color:#dffaff;font-family:Arial,sans-serif}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#0b2833 0,#031017 38%,#010508 72%),repeating-linear-gradient(0deg,transparent 0 4px,rgba(87,230,255,.025) 5px);}
#shell{position:absolute;inset:4.5vh 5vw;border:1px solid var(--line);clip-path:polygon(2% 0,98% 0,100% 4%,100% 96%,98% 100%,2% 100%,0 96%,0 4%);padding:4vh 4vw;background:linear-gradient(135deg,rgba(5,29,39,.55),rgba(1,7,10,.15));box-shadow:inset 0 0 70px rgba(15,160,210,.08)}
#top{display:flex;justify-content:space-between;letter-spacing:.28em;font-size:1.25vw;color:var(--cyan);border-bottom:1px solid var(--line);padding-bottom:1.5vh}#state{opacity:.8}
#content{position:absolute;left:4vw;right:4vw;top:10vh;bottom:6vh;display:flex;align-items:center;justify-content:center}
#text{max-width:82%;text-align:center}h1{font-size:3.2vw;letter-spacing:.13em;margin:0 0 2vh;text-transform:uppercase}p{font-size:1.65vw;line-height:1.5;color:#b9dce5;white-space:pre-wrap}
#visual{width:100%;height:100%;display:none;filter:drop-shadow(0 0 12px rgba(87,230,255,.28))}#visual svg{width:100%;height:100%}
.grid{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:2vw}.card{min-height:20vh;border:1px solid var(--line);padding:2vw;background:rgba(4,27,36,.62);position:relative}.card:before{content:"";position:absolute;left:0;top:0;width:2.5vw;border-top:3px solid var(--cyan)}
.card h2{color:var(--cyan);font-size:1.7vw;letter-spacing:.08em}.card p{font-size:1.2vw;text-align:left}.pulse{animation:pulse 1.7s infinite}@keyframes pulse{50%{opacity:.35}}
</style></head><body><main id="shell"><header id="top"><span>JARVIS // HYBRID CORE</span><span id="state">BEREIT</span></header><section id="content"><div id="text"><h1 id="title">Bereit.</h1><p id="subtitle">Sag „Jarvis“.</p></div><div id="visual"></div></section></main>
<script>
const NS='urn:x-cast:com.jarvis.receiver', ctx=cast.framework.CastReceiverContext.getInstance();
const $=id=>document.getElementById(id), title=$('title'), subtitle=$('subtitle'), text=$('text'), visual=$('visual'), state=$('state');
let svgParts=[], legacyParts=[], ttsBlocks=new Map(), readyBlocks=new Map(), expectedBlocks=0, queueEnded=false, playing=false, currentAudio=null, stopped=false;
const send=(type,extra={})=>{for(const sender of ctx.getSenders())ctx.sendCustomMessage(NS,sender.id,{type,...extra})};
const showText=(t,s,st='AKTIV')=>{visual.style.display='none';text.style.display='block';title.textContent=t||'JARVIS';subtitle.textContent=s||'';state.textContent=st};
const stopAudio=(notify=true)=>{stopped=true;if(currentAudio){currentAudio.pause();currentAudio.src='';currentAudio=null}readyBlocks.forEach(x=>URL.revokeObjectURL(x));readyBlocks.clear();ttsBlocks.clear();playing=false;if(notify)send('SPEAK_DONE')};
async function playQueue(){if(playing||stopped)return;playing=true;send('SPEAK_STARTED');let i=0;while(!stopped){const url=readyBlocks.get(i);if(!url){if(queueEnded&&i>=expectedBlocks)break;await new Promise(r=>setTimeout(r,25));continue}readyBlocks.delete(i++);await new Promise(resolve=>{const a=currentAudio=new Audio(url);a.preload='auto';a.onended=a.onerror=()=>{URL.revokeObjectURL(url);resolve()};a.play().catch(resolve)});}playing=false;currentAudio=null;if(!stopped)send('SPEAK_DONE')}
function assemble(index){const parts=ttsBlocks.get(index)||[];if(!parts.length)return;const raw=atob(parts.join('')), bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);readyBlocks.set(index,URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'})));playQueue()}
function cards(items){visual.innerHTML='<div class="grid">'+items.map((x,i)=>`<article class="card"><h2>${i+1} // ${esc(x.titel||x.label||x.name||'MODUL')}</h2><p>${esc(x.beschreibung||x.sub||x.description||'')}</p></article>`).join('')+'</div>';text.style.display='none';visual.style.display='block'}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
ctx.addCustomMessageListener(NS,e=>{const d=typeof e.data==='string'?JSON.parse(e.data):e.data||{};try{switch(d.type){
case 'STANDBY':case 'SHOW_INFO':case 'SHOW_STATE':showText(d.title,d.subtitle||d.text,d.state||'AKTIV');break;
case 'SHOW_VISUAL_LOADING':showText(d.title||'VISUALISIERUNG','Technische Darstellung wird synchronisiert …','ANALYSE');title.classList.add('pulse');break;
case 'SHOW_SVG_BEGIN':svgParts=new Array(d.chunks||0);title.classList.remove('pulse');break;
case 'SHOW_SVG_CHUNK':svgParts[d.index]=d.data;break;
case 'SHOW_SVG_END':visual.innerHTML=svgParts.join('');text.style.display='none';visual.style.display='block';state.textContent='VISUAL';break;
case 'HIDE_VISUALIZATION':showText('Bereit.','Sag „Jarvis“.','BEREIT');break;
case 'SHOW_IDEAS':cards(d.ideas||d.items||[]);break;
case 'SHOW_RECIPE':cards([{titel:d.title||d.titel,beschreibung:[...(d.ingredients||d.zutaten||[]),...(d.steps||d.schritte||[])].join('\n')}]);break;
case 'SHOW_DIAGRAM':cards(d.nodes||[]);break;
case 'TTS_QUEUE_BEGIN':stopAudio(false);stopped=false;expectedBlocks=d.blocks||0;queueEnded=false;state.textContent='SPRICHT';break;
case 'TTS_BLOCK_BEGIN':ttsBlocks.set(d.index,new Array(d.chunks||0));break;
case 'TTS_BLOCK_CHUNK':ttsBlocks.get(d.index)[d.chunk]=d.data;break;
case 'TTS_BLOCK_END':assemble(d.index);break;
case 'TTS_QUEUE_END':queueEnded=true;playQueue();break;
case 'SPEAK_BEGIN':stopAudio(false);stopped=false;legacyParts=new Array(d.chunks||0);state.textContent='SPRICHT';break;
case 'SPEAK_CHUNK':legacyParts[d.index]=d.data;break;
case 'SPEAK_END':ttsBlocks.set(0,legacyParts);expectedBlocks=1;queueEnded=true;assemble(0);break;
case 'SPEAK_STOP':stopAudio();break;
}}catch(err){send('SPEAK_ERROR',{error:String(err)})}});
const opts=new cast.framework.CastReceiverOptions();opts.disableIdleTimeout=true;ctx.start(opts);
</script></body></html>
