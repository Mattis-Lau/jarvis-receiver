<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JARVIS Receiver</title>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(rgba(70, 183, 231, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(70, 183, 231, .025) 1px, transparent 1px),
        radial-gradient(circle at 50% 38%, rgba(36, 150, 205, .15), transparent 38%),
        linear-gradient(180deg, #06111b 0%, #02070c 100%);
      background-size: 4.5vw 4.5vw, 4.5vw 4.5vw, auto, auto;
      color: #eaf8ff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 3.2vh 3.6vw 2.6vh;
    }

    .top {
      height: 10vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(111,211,255,.28);
    }

    .brand {
      font-size: 2.2vw;
      letter-spacing: .65vw;
      font-weight: 700;
      white-space: nowrap;
    }

    .online {
      font-size: 1.05vw;
      letter-spacing: .16vw;
      color: #86dcff;
      white-space: nowrap;
    }

    .dot {
      display: inline-block;
      width: .6vw;
      height: .6vw;
      border-radius: 50%;
      background: #86dcff;
      margin-right: .65vw;
      box-shadow: 0 0 16px #86dcff;
    }

    main {
      height: 82vh;
      padding-top: 3.5vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      max-width: none;
      margin: 0;
    }

    .eyebrow {
      color: #78d4ff;
      font-size: 1vw;
      letter-spacing: .25vw;
      text-transform: uppercase;
      margin-bottom: 1.2vh;
      flex: 0 0 auto;
    }

    h1 {
      font-size: 3.3vw;
      line-height: 1.08;
      margin: 0 0 1.1vh;
      font-weight: 500;
      flex: 0 0 auto;
    }

    .subtitle {
      font-size: 1.55vw;
      line-height: 1.25;
      color: #aac4d1;
      margin-bottom: 2.5vh;
      flex: 0 0 auto;
    }

    .hint {
      margin-top: 1.7vh;
      font-size: 1.05vw;
      color: #78d4ff;
      flex: 0 0 auto;
    }

    .grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2.2vh 1.55vw;
      margin-top: .4vh;
    }

    .card {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(85, 209, 255, .42);
      background:
        linear-gradient(135deg, rgba(15, 46, 67, .88), rgba(5, 18, 30, .76));
      border-radius: 1.05vw;
      padding: 1.7vh 1.55vw 1.45vh;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.025),
        0 0 2.1vw rgba(26, 167, 224, .07);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: .22vw;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(93, 222, 255, .95),
        rgba(66, 132, 255, .28)
      );
      box-shadow: 0 0 1vw rgba(73, 211, 255, .48);
    }

    .card::after {
      content: "";
      position: absolute;
      right: -4vw;
      top: -7vh;
      width: 13vw;
      height: 13vw;
      border: 1px solid rgba(94, 216, 255, .10);
      border-radius: 50%;
      box-shadow:
        0 0 0 1.4vw rgba(75, 176, 227, .025),
        0 0 0 3vw rgba(75, 176, 227, .018);
      pointer-events: none;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .7vh;
      position: relative;
      z-index: 1;
    }

    .num {
      color: #82e3ff;
      font-size: .88vw;
      letter-spacing: .22vw;
      font-weight: 700;
    }

    .card-meta {
      display: flex;
      gap: .45vw;
      align-items: center;
    }

    .chip {
      border: 1px solid rgba(102, 212, 255, .28);
      background: rgba(70, 182, 232, .08);
      color: #9edfff;
      border-radius: 999px;
      padding: .36vh .55vw;
      font-size: .68vw;
      letter-spacing: .045vw;
      white-space: nowrap;
    }

    .card-title {
      position: relative;
      z-index: 1;
      font-size: 1.72vw;
      line-height: 1.04;
      font-weight: 600;
      margin: .15vh 0 .7vh;
      color: #f4fbff;
      max-width: 86%;
    }

    .desc {
      position: relative;
      z-index: 1;
      font-size: .95vw;
      line-height: 1.28;
      color: #a9c7d6;
      max-width: 94%;
      min-height: 2.4em;
      overflow: hidden;
    }

    .ingredients {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding-top: .75vh;
      display: flex;
      gap: .42vw;
      flex-wrap: wrap;
      border-top: 1px solid rgba(107, 207, 247, .11);
    }

    .ingredient {
      color: #d7f4ff;
      background: rgba(113, 211, 255, .055);
      border-radius: .36vw;
      padding: .34vh .45vw;
      font-size: .72vw;
      white-space: nowrap;
    }

    .text {
      font-size: 1.4vw;
      line-height: 1.45;
      color: #c8dce6;
      white-space: pre-wrap;
      overflow: hidden;
    }

    .step {
      border-left: 3px solid #75d8ff;
      padding-left: 1.6vw;
      margin-top: 1vh;
    }

    #jarvisAudio {
      display: none;
    }

    #debug {
      position: fixed;
      right: 1.2vw;
      bottom: .8vh;
      font-size: .7vw;
      color: rgba(135,220,255,.42);
      pointer-events: none;
    }

    /* Rezeptansicht */
    .recipe-layout {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: .85fr 1.35fr;
      gap: 2vw;
    }

    .recipe-panel {
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(111,211,255,.30);
      background: rgba(11,35,50,.52);
      border-radius: 1.1vw;
      padding: 2.2vh 1.8vw;
    }

    .recipe-panel h2 {
      margin: 0 0 1.4vh;
      color: #78d4ff;
      font-size: 1.5vw;
      font-weight: 500;
    }

    .recipe-panel ul,
    .recipe-panel ol {
      margin: 0;
      padding-left: 1.5vw;
      font-size: 1.18vw;
      line-height: 1.42;
    }

    .recipe-panel li {
      margin-bottom: .7vh;
    }
  </style>
</head>

<body>
  <audio id="jarvisAudio" preload="auto"></audio>
  <header class="top">
    <div class="brand">JARVIS</div>
    <div class="online"><span class="dot"></span>SYSTEM ONLINE</div>
  </header>

  <main id="main">
    <div class="eyebrow">ASSISTENT</div>
    <h1>Bereit.</h1>
    <div class="subtitle">Warte auf eine Anfrage.</div>
    <div class="hint">ONLINE</div>
  </main>

  <div id="debug">Receiver gestartet</div>

  <script>
    const NAMESPACE = 'urn:x-cast:com.jarvis.receiver';
    const context = cast.framework.CastReceiverContext.getInstance();
    const main = document.getElementById('main');
    const debug = document.getElementById('debug');

    function esc(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setDebug(text) {
      debug.textContent = text;
      console.log('[JARVIS]', text);
    }

    function showStandby(data = {}) {
      main.innerHTML = `
        <div class="eyebrow">${esc(data.eyebrow || 'ASSISTENT')}</div>
        <h1>${esc(data.title || 'Bereit.')}</h1>
        <div class="subtitle">${esc(data.subtitle || 'Warte auf eine Anfrage.')}</div>
        <div class="hint">${esc(data.hint || 'ONLINE')}</div>
      `;
    }

    function showIdeas(data) {
      const items = Array.isArray(data.items) ? data.items.slice(0, 4) : [];

      main.innerHTML = `
        <div class="eyebrow">CULINARY // OPTIONS</div>
        <h1>${esc(data.title || 'Was möchtest du kochen?')}</h1>
        <div class="subtitle">${esc(data.subtitle || '')}</div>

        <div class="grid">
          ${items.map((item, i) => {
            const ingredients = Array.isArray(item.ingredients)
              ? item.ingredients.slice(0, 3)
              : [];

            return `
              <div class="card">
                <div class="card-head">
                  <div class="num">OPTION 0${i + 1}</div>
                  <div class="card-meta">
                    ${item.duration ? `<span class="chip">${esc(item.duration)}</span>` : ''}
                    ${item.difficulty ? `<span class="chip">${esc(item.difficulty)}</span>` : ''}
                  </div>
                </div>

                <div class="card-title">${esc(item.title || item.titel || '')}</div>
                <div class="desc">${esc(item.description || item.beschreibung || '')}</div>

                ${ingredients.length ? `
                  <div class="ingredients">
                    ${ingredients.map(x => `<span class="ingredient">${esc(x)}</span>`).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>

        <div class="hint">${esc(data.hint || 'Sag einfach die Nummer.')}</div>
      `;
    }

    function showRecipe(data) {
      const ingredients = Array.isArray(data.ingredients)
        ? data.ingredients
        : (Array.isArray(data.zutaten) ? data.zutaten : []);

      const steps = Array.isArray(data.steps)
        ? data.steps
        : (Array.isArray(data.schritte) ? data.schritte : []);

      if (ingredients.length || steps.length) {
        main.innerHTML = `
          <div class="eyebrow">REZEPT</div>
          <h1>${esc(data.title || data.titel || 'Rezept')}</h1>
          <div class="subtitle">${esc(data.subtitle || '')}</div>

          <div class="recipe-layout">
            <section class="recipe-panel">
              <h2>Zutaten</h2>
              <ul>
                ${ingredients.map(x => `<li>${esc(x)}</li>`).join('')}
              </ul>
            </section>

            <section class="recipe-panel">
              <h2>Zubereitung</h2>
              <ol>
                ${steps.map(x => `<li>${esc(x)}</li>`).join('')}
              </ol>
            </section>
          </div>

          <div class="hint">${esc(data.hint || 'Sag „nächster Schritt“ zum Fortfahren.')}</div>
        `;
      } else {
        main.innerHTML = `
          <div class="eyebrow">REZEPT</div>
          <h1>${esc(data.title || 'Rezept')}</h1>
          <div class="subtitle">${esc(data.subtitle || '')}</div>
          <div class="text">${esc(data.text || data.content || '')}</div>
          <div class="hint">${esc(data.hint || 'Sag „nächster Schritt“ zum Fortfahren.')}</div>
        `;
      }
    }

    function showStep(data) {
      main.innerHTML = `
        <div class="eyebrow">SCHRITT ${esc(data.step || '')}</div>
        <h1>${esc(data.title || 'Zubereitung')}</h1>
        <div class="step">
          <div class="text">${esc(data.text || data.content || '')}</div>
        </div>
        <div class="hint">${esc(data.hint || 'Sag „weiter“, wenn du bereit bist.')}</div>
      `;
    }

    function showInfo(data) {
      main.innerHTML = `
        <div class="eyebrow">${esc(data.eyebrow || 'INFORMATION')}</div>
        <h1>${esc(data.title || 'JARVIS')}</h1>
        <div class="text">${esc(data.text || data.content || '')}</div>
        <div class="hint">${esc(data.hint || '')}</div>
      `;
    }

    const jarvisAudio = document.getElementById('jarvisAudio');

    let speechSenderId = null;
    let speechChunks = [];
    let speechExpectedChunks = 0;
    let speechMime = 'audio/mpeg';
    let speechObjectUrl = null;

    function sendSpeechEvent(type, extra = {}) {
      if (!speechSenderId) return;

      try {
        context.sendCustomMessage(
          NAMESPACE,
          speechSenderId,
          Object.assign(
            { type },
            extra
          )
        );
      } catch (err) {
        console.warn(
          'JARVIS Speech Event konnte nicht gesendet werden:',
          err
        );
      }
    }

    function speechBegin(senderId, data) {
      speechSenderId = senderId;
      speechExpectedChunks = Number(data.chunks || 0);
      speechMime = data.mime || 'audio/mpeg';
      speechChunks = new Array(speechExpectedChunks);

      setDebug(
        'TTS empfangen: 0/' + speechExpectedChunks
      );
    }

    function speechChunk(data) {
      const index = Number(data.index);

      if (
        Number.isInteger(index) &&
        index >= 0 &&
        index < speechChunks.length
      ) {
        speechChunks[index] = data.data || '';
      }
    }

    async function speechEnd() {
      try {
        if (
          !speechExpectedChunks ||
          speechChunks.some(chunk => typeof chunk !== 'string')
        ) {
          throw new Error(
            'TTS-Chunks unvollstaendig.'
          );
        }

        const base64 = speechChunks.join('');
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        if (speechObjectUrl) {
          URL.revokeObjectURL(speechObjectUrl);
        }

        const blob = new Blob(
          [bytes],
          { type: speechMime }
        );

        speechObjectUrl = URL.createObjectURL(blob);

        jarvisAudio.src = speechObjectUrl;
        jarvisAudio.currentTime = 0;

        setDebug('TTS wird abgespielt');

        await jarvisAudio.play();

      } catch (err) {
        console.error(
          'JARVIS Audio Error:',
          err
        );

        sendSpeechEvent(
          'SPEAK_ERROR',
          { error: String(err) }
        );

        speechSenderId = null;
        speechChunks = [];
        speechExpectedChunks = 0;
      }
    }

    jarvisAudio.addEventListener(
      'playing',
      () => {
        setDebug('TTS spielt');
        sendSpeechEvent('SPEAK_STARTED');
      }
    );

    jarvisAudio.addEventListener(
      'ended',
      () => {
        setDebug('TTS beendet');
        sendSpeechEvent('SPEAK_DONE');

        speechSenderId = null;
        speechChunks = [];
        speechExpectedChunks = 0;
      }
    );

    jarvisAudio.addEventListener(
      'error',
      () => {
        const code =
          jarvisAudio.error?.code ??
          'unbekannt';

        sendSpeechEvent(
          'SPEAK_ERROR',
          {
            error:
              'HTMLAudioElement Fehlercode ' +
              String(code)
          }
        );

        speechSenderId = null;
        speechChunks = [];
        speechExpectedChunks = 0;
      }
    );

    function handleMessage(event) {
      let data = event.data;

      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (_) {
          data = { type: 'SHOW_INFO', text: data };
        }
      }

      if (!data || typeof data !== 'object') return;

      setDebug('Empfangen: ' + (data.type || 'unbekannt'));

      switch (data.type) {
        case 'SHOW_IDEAS':
          showIdeas(data);
          break;

        case 'SHOW_RECIPE':
          showRecipe(data);
          break;

        case 'SHOW_STEP':
          showStep(data);
          break;

        case 'SHOW_INFO':
          showInfo(data);
          break;

        case 'STANDBY':
        case 'SHOW_STANDBY':
          showStandby(data);
          break;

        case 'SPEAK_BEGIN':
          speechBegin(
            event.senderId,
            data
          );
          break;

        case 'SPEAK_CHUNK':
          speechChunk(data);
          break;

        case 'SPEAK_END':
          speechEnd();
          break;

        default:
          showInfo({
            title: 'Nachricht empfangen',
            text: JSON.stringify(data, null, 2)
          });
      }

      if (data.type !== 'SPEAK_CHUNK') {
        try {
          context.sendCustomMessage(
            NAMESPACE,
            event.senderId,
            { type: 'ACK', receivedType: data.type || null }
          );
        } catch (err) {
          console.warn('ACK konnte nicht gesendet werden:', err);
        }
      }
    }

    context.addCustomMessageListener(NAMESPACE, handleMessage);

    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    options.statusText = 'JARVIS bereit';
    options.customNamespaces = {};
    options.customNamespaces[NAMESPACE] =
      cast.framework.system.MessageType.JSON;

    context.start(options);
    setDebug('JARVIS Receiver bereit');
  </script>
</body>
</html>
